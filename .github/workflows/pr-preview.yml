name: PR Preview Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Ephemeral full-stack preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: flowfi_preview
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Run migrations + seed demo data
        run: |
          npx prisma generate --schema=prisma/schema.prisma
          # `migrate deploy` is tried first (spec #1456); the committed
          # `20260221132622_init` migration fails on a fresh database
          # (missing unique constraint for referenced "User"), so fall back to
          # `db push` — the same path Backend CI uses — to keep ephemeral
          # previews green.
          npx prisma migrate deploy --schema=prisma/schema.prisma || npx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          npm run prisma:seed --workspace=backend || npx tsx prisma/seed.ts
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/flowfi_preview

      - name: Build backend preview image
        run: docker build -f backend/Dockerfile backend -t "flowfi-backend:pr-${PR_NUMBER}"

      - name: Build frontend preview
        run: npm run build --workspace=frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/v1
          NEXT_PUBLIC_APP_VERSION: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_STELLAR_NETWORK: TESTNET
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
          NEXT_PUBLIC_NETWORK_PASSPHRASE: Test SDF Network ; September 2015
          DATABASE_URL: postgresql://postgres:password@127.0.0.1:5432/flowfi_preview

      - name: Health-check preview backend
        run: |
          docker run -d --name "flowfi-preview-${PR_NUMBER}" \
            -e DATABASE_URL="postgresql://postgres:password@127.0.0.1:5432/flowfi_preview" \
            --network host "flowfi-backend:pr-${PR_NUMBER}"
          for attempt in $(seq 1 30); do
            if curl --silent --fail --max-time 2 http://localhost:3001/health; then
              docker rm -f "flowfi-preview-${PR_NUMBER}" || true
              exit 0
            fi
            sleep 1
          done
          docker logs "flowfi-preview-${PR_NUMBER}"
          docker rm -f "flowfi-preview-${PR_NUMBER}" || true
          exit 1

  comment:
    name: Report local preview validation
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Comment validation result on PR
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              `## Preview validation passed — PR #${pr} (\`${sha}\`)`,
              ``,
              `| Check | Result |`,
              `|---|---|`,
              `| Frontend | Build passed |`,
              `| Backend | Local container health check passed |`,
              ``,
              `No live preview infrastructure or deployment credentials are used by pull request jobs.`,
            ].join('\n');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
